# To change this template, choose Tools | Templates
# and open the template in the editor.

# Database

db_user=
db_password=
db_url=jdbc:mysql://127.0.0.1:3306/drugref
db_driver=com.mysql.cj.jdbc.Driver

# Integration

# What database integration is being used.
# cdpd: Canadian Drug Product Database
# vigilance: Vigilance Sante https://www.vigilance.ca/home
# default is CDPD
database.integration=cdpd

# Integration Settings

sort_down_mfg_tagged_generics=false
interaction_base_url=
scheduled_timer=300000

# Vigilance Sante data files API (used by updateDB when database.integration=vigilance)
# credentials are provided by the external drugref2.properties override
vigilance.files.base.url=${vigilance.files.base.url:}
vigilance.username=${vigilance.username:}
vigilance.password=${vigilance.password:}
vigilance.user.id=${vigilance.user.id:}
vigilance.client.id=${vigilance.client.id:false}
vigilance.client.secret=${vigilance.client.secret:}
